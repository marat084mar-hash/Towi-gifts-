<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.min.css">
    
    <!-- Простой относительный путь к CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <title>Инвентарь - Towi Gifts</title>
</head>
<body>
    <!--==================== HEADER ====================-->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo">Towi Gifts</a>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <!-- Простые относительные пути к страницам -->
                    <li class="nav__item"><a href="index.html" class="nav__link">Главная</a></li>
                    <li class="nav__item"><a href="cases.html" class="nav__link">Кейсы</a></li>
                    <li class="nav__item"><a href="inventory.html" class="nav__link active-link">Инвентарь</a></li>
                    <li class="nav__item"><a href="upgrade.html" class="nav__link">Апгрейд</a></li>
                </ul>
                <div class="nav__close" id="nav-close"><i class="ri-close-line"></i></div>
            </div>
            <div class="nav__toggle" id="nav-toggle"><i class="ri-menu-line"></i></div>
        </nav>
    </header>

    <main class="main">
        <!-- ЗАГЛУШКА ДЛЯ ОБЫЧНОГО БРАУЗЕРА (копируем ту же логику) -->
        <div id="non-telegram-placeholder" style="display: none; text-align: center; padding: 50px; color: var(--text-color);">
            <h1>👋 Привет!</h1>
            <p>Для просмотра инвентаря, пожалуйста, откройте приложение через бота <a href="https://t.me/Towigifts_bot" style="color: var(--first-color);">@Towigifts_bot</a>.</p>
        </div>

        <!-- ОСНОВНОЙ КОНТЕЙНЕР ПРИЛОЖЕНИЯ -->
        <div id="app-container" style="display: none;">
            <section class="inventory section container" id="inventory">
                <h2 class="section__title-center">Мой инвентарь</h2>
                <div class="inventory__container grid">
                    <!-- Сюда в будущем будем загружать предметы пользователя -->
                    <p style="color: var(--text-color); text-align: center;">Ваш инвентарь пока пуст. Откройте кейс, чтобы получить свой первый предмет!</p>
                </div>
            </section>
        </div>
    </main>

    <!--==================== FOOTER ====================-->
    <footer class="footer section">
        <div class="footer__container container grid">
            <p class="footer__copy">&#169; Towi Gifts. Все права защищены</p>
        </div>
    </footer>

    <!--=============== TELEGRAM & JS ===============-->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Простые относительные пути к JS -->
    <script src="assets/js/global.v2.js" type="module"></script>
    <!-- Сюда позже добавим inventory.js, пока достаточно global -->
</body>
</html>
