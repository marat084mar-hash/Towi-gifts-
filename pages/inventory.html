<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts - Инвентарь</title>

    <!-- Скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" referrerpolicy="no-referrer">

    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global.v2.js"></script>
    <!-- Подключаем скрипт для логики инвентаря -->
    <script src="js/inventory.js"></script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <button class="back-button" onclick="history.back()">
                <i class="fas fa-chevron-left" aria-hidden="true"></i>
                <span class="sr-only">Вернуться назад</span>
            </button>
            <h1 id="pageTitle"></h1>

            <!-- Блок баланса и пополнения в шапке -->
            <div class="balance-info" style="position: absolute; right: 20px; top: 15px;">
                <button class="add-balance-btn" onclick="showTopUpModal()" aria-label="Пополнить баланс">
                    <i class="fas fa-plus" aria-hidden="true"></i>
                </button>
            </div>
        </header>

        <!-- Блок с аватаром и именем пользователя -->
        <div class="user-info">
            <img id="userAvatar" src="" alt="Аватар пользователя" class="avatar">
            <span class="username-text" id="username"></span>
        </div>

        <!-- Сообщение о КД на вывод подарков -->
        <p id="cooldownMessage" style="color: var(--text-muted); text-align: center; margin: 20px 0;"></p>

        <!-- Отображение текущего баланса -->
        <div style="text-align: center; margin-top: 20px; margin-bottom: 20px;">
            <span class="balance-text" id="userBalance" style="font-size: 18px;"></span>
        </div>

        <!-- Инвентарь -->
        <div id="inventory-items-grid" class="card-grid">
            <p style="text-align: center; color: var(--text-muted);" id="emptyInventoryMessage"></p>
        </div>
    </div>

    <!-- Модальное окно пополнения -->
    <div id="topUpModal" class="modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="topUpModalTitle">
        <div class="modal-content">
            <span class="close-btn" aria-label="Закрыть окно" onclick="closeTopUpModal()">&times;</span>
            <h2 id="topUpModalTitle"></h2>

            <div class="payment-options">
                <button class="payment-option" data-method="ton">
                    <i class="fas fa-coins" aria-hidden="true"></i>
            <div>
                        <strong id="paymentMethodTON"></strong>
                <span id="paymentBonusTON"></span>
            </div>
                </button>

                <button class="payment-option" data-method="stars">
            <i class="fas fa-star" aria-hidden="true"></i>
            <div>
                <strong id="paymentMethodStars"></strong>
                <span id="paymentRateStars"></span>
            </div>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
