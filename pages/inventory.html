<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Заголовок страницы будет установлен global.js -->
    <title id="page-html-title">Towi Gifts инвентарь </title> 
    
    <!-- Правильный путь к стилям (на уровень выше, из папки pages) -->
    <link rel="stylesheet" href="../style.css"> 
    
    <!-- Иконки Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header class="app-header">
        <div class="user-profile">
            <!-- Кнопка "Назад" - только для подстраниц -->
            <button class="back-button" onclick="history.back()"><i class='bx bx-chevron-left'></i></button>
            <img id="user-avatar" src="https://i.pravatar.cc/150" alt="Avatar" class="avatar">
            <div>
                <span id="user-balance-value">0.00 TON</span>
                <span id="user-username">@username</span>
            </div>
        </div>
        <div class="balance-controls">
            <button id="deposit-btn" title="Пополнить баланс">+</button>
        </div>
    </header>

    <main>
        <!-- Динамический заголовок страницы, устанавливается global.js -->
        <h1 id="page-dynamic-title" class="page-title"></h1> 
        
        <!-- Контейнер для динамического контента страницы (кейсы, инвентарь, апгрейд) -->
        <div id="dynamic-content-container" class="grid-container">
            <div class="loader"></div> <!-- Универсальный лоадер, будет заменен JS-ом -->
        </div>
    </main>

    <!-- Модальное окно для пополнения (одинаковое на всех страницах) -->
    <div id="deposit-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Пополнение баланса</h2>
            <p>Выберите способ оплаты:</p>
            <div class="payment-options">
                <button id="pay-ton-btn" class="payment-button">
                    Пополнить через TON
                    <span class="bonus">+10% бонус к пополнению!</span>
                </button>
                <button id="pay-stars-btn" class="payment-button">
                    Пополнить через Telegram Stars
                    <span class="bonus">Вывод заблокирован на 21 день</span>
                </button>
            </div>
            <button id="close-modal-btn" style="margin-top: 20px;">Закрыть</button>
        </div>
    </div>
    <!-- Нижняя навигация (одинаковая на всех страницах, активная ссылка подсвечивается global.js) -->
    <nav class="bottom-nav main-menu">
        <a href="cases.html" class="menu-button"><i class='bx bxs-box icon'></i> <span>Кейсы</span></a>
        <a href="upgrade.html" class="menu-button"><i class='bx bxs-up-arrow-circle icon'></i> <span>Апгрейд</span></a>
        <a href="inventory.html" class="menu-button"><i class='bx bxs-briefcase-alt-2 icon'></i> <span>Инвентарь</span></a>
    </nav>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- 1. Загружаем CDN Supabase как ОБЫЧНЫЙ скрипт -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    <!-- 2. Затем наш скрипт config/supabase.js, который теперь будет использовать глобальный 'supabase' -->
    <script src="../config/supabase.js"></script>
    <!-- 3. Затем global.js -->
    <script src="../js/global.js"></script>
    <script src="../js/inventory.js"></script>
    
    <!-- !!! ЭТА СТРОКА ОТЛИЧАЕТСЯ ДЛЯ КАЖДОЙ СТРАНИЦЫ !!! -->
    <!-- Для pages/cases.html: -->
    <!-- <script src="../js/cases.v2.js"></script> -->
    <!-- Для pages/inventory.html: -->
    <!-- <script src="../js/inventory.js"></script> -->
    <!-- Для pages/upgrade.html: -->
    <!-- <script src="../js/upgrade.js"></script> -->
</body>
</html>
