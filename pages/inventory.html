<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инвентарь - Towi Gifts</title>

    <!-- Правильный путь к стилям на уровень выше (из папки pages) -->
    <link rel="stylesheet" href="../style.css"> 
    
    <!-- Используем Boxicons для консистентности (как в index.html) -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header class="app-header">
        <div class="user-profile">
            <!-- Кнопка "Назад" - только для подстраниц -->
            <button class="back-button" onclick="history.back()">
                <i class='bx bx-chevron-left'></i>
            </button>
            <img id="user-avatar" src="https://i.pravatar.cc/150" alt="Avatar" class="avatar">
            <div>
                <span id="user-balance-value">0.00 TON</span>
                <span id="user-username">@username</span>
            </div>
        </div>
        <div class="balance-controls">
            <button id="deposit-btn" title="Пополнить баланс">+</button>
        </div>
    </header>

    <main>
        <h1 class="page-title">Мой инвентарь</h1>
        
        <!-- Сообщение о КД на вывод подарков (для Telegram Stars) -->
        <p id="cooldownMessage" class="hint-text"></p>

        <!-- Инвентарь -->
        <div id="inventory-items-grid" class="grid-container">
            <p style="text-align: center; color: var(--text-hint);" id="emptyInventoryMessage">
                Инвентарь пуст. Откройте кейс, чтобы получить предметы!
            </p>
            <div class="loader"></div> <!-- Анимация загрузки -->
        </div>
    </main>

    <!-- Модальное окно для пополнения (копируем из index.html) -->
    <div id="deposit-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Пополнение баланса</h2>
            <p>Выберите способ оплаты:</p>
            <div class="payment-options">
                <button id="pay-ton-btn" class="payment-button">
                    Пополнить через TON
                    <span class="bonus">+10% бонус к пополнению!</span>
                </button>
                <button id="pay-stars-btn" class="payment-button">
                    Пополнить через Telegram Stars
                    <span class="bonus">Вывод заблокирован на 21 день</span>
                </button>
            </div>
            <button id="close-modal-btn" style="margin-top: 20px;">Закрыть</button>
        </div>
    </div>
    <!-- Нижняя навигация (копируем из index.html, пути относительные) -->
    <nav class="bottom-nav main-menu">
        <a href="cases.html" class="menu-button">
            <i class='bx bxs-box icon'></i>
            <span>Кейсы</span>
        </a>
        <a href="upgrade.html" class="menu-button">
            <i class='bx bxs-up-arrow-circle icon'></i>
            <span>Апгрейд</span>
        </a>
        <a href="inventory.html" class="menu-button active"> <!-- Добавляем класс 'active' для текущей страницы -->
            <i class='bx bxs-briefcase-alt-2 icon'></i>
            <span>Инвентарь</span>
        </a>
    </nav>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Правильные пути к скриптам на уровень выше -->
    <script type="module" src="../config/supabase.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/inventory.js"></script> <!-- Скрипт для этой страницы -->
</body>
</html>
