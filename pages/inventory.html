<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts - Инвентарь</title>

    <!-- Скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" referrerpolicy="no-referrer">

    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global.v2.js"></script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <button class="back-button" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Inventory</h1>

            <!-- Блок баланса и пополнения в шапке -->
            <div class="balance-info" style="position: absolute; right: 20px; top: 15px;">
                <button class="add-balance-btn" onclick="showTopUpModal()">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </header>

        <!-- Блок с аватаром и именем пользователя -->
        <div class="user-info">
            <img id="userAvatar" src="images/default-avatar.png" alt="Аватар" class="avatar">
            <span class="username-text" id="username">@user</span>
        </div>

        <!-- Сообщение о КД на вывод подарков -->
        <p id="cooldownMessage" style="color: var(--text-muted); text-align: center; margin: 20px 0;">
            <i class="fas fa-hourglass-half"></i> КД 21 день на вывод подарков! Telegram Stars
        </p>

        <!-- Отображение текущего баланса -->
        <div style="text-align: center; margin-top: 20px; margin-bottom: 20px;">
            <span class="balance-text" id="userBalance" style="font-size: 18px;">Balance: 0.00 TON</span>
        </div>

        <!-- Инвентарь -->
        <div id="inventory-items-grid" class="card-grid">
            <p style="text-align: center; color: var(--text-muted);" id="emptyInventoryMessage">Your inventory is empty.</p>
        </div>
    </div>

    <!-- Модальное окно пополнения -->
   <div id="topUpModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Пополнение баланса</h2>

        <div class="payment-options">
            <button class="payment-option" data-method="ton">
                <i class="fas fa-coins"></i>
                <div>
                    <strong>TON</strong>
                    <span>Бонус +10 %</span>
                </div>
            </button>

            <button class="payment-option" data-method="stars">
                <i class="fas fa-star"></i>
                <div>
            <strong>Telegram Stars</strong>
            <span>100 звёзд = 1 TON</span>
                </div>
            </button>
        </div>
    </div>
</div>

</body>
</html>
