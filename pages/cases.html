<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts - Кейсы</title>
    
    <!-- Скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" referrerpolicy="no-referrer" />
    
    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Скрипты (ПРАВИЛЬНЫЙ ПОРЯДОК) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    <script src="js/cases.v2.js"></script>
    <script src="js/global.v2.js"></script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <button class="back-button" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Cases</h1>
            <!-- Блок баланса и пополнения в шапке -->
            <div class="balance-info" style="position: absolute; right: 20px; top: 15px;">
                <button class="add-balance-btn" onclick="showTopUpModal()">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </header>

        <!-- Отображение текущего баланса и имени пользователя в шапке -->
        <div style="text-align: right; margin-top: 10px; margin-bottom: 20px;">
            <span class="balance-text" id="userBalance" style="font-size: 18px;">Balance: 0.00 TON</span><br>
            <span class="username-text" id="username" style="font-size: 14px;">@guest</span>
        </div>

        <!-- Здесь будет твой список кейсов. -->
        <div id="casesListContainer" class="card-grid" style="margin-top: 30px;">
            <!-- Временно, пока кейсы загружаются -->
            <p style="color: var(--text-muted); text-align: center; width: 100%;">Загрузка кейсов...</p>
        </div>

    </div>

    <!-- МОДАЛЬНОЕ ОКНО ОТКРЫТИЯ КЕЙСА (ДОБАВЛЕНО) -->
    <div id="caseOpeningModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 450px;">
            <button class="close-btn" onclick="closeCaseOpeningModal()">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="modal-title" id="caseOpeningTitle">Opening Case...</h2>
            
            <div id="caseOpeningAnimation" style="text-align: center; margin: 20px 0;">
                <p style="font-size: 2em; font-weight: bold; color: var(--primary-purple);" id="animationText">
                    Spinning...
                </p>
                <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--text-muted); margin-top: 20px;"></i>
            </div>

            <div id="caseOpeningResult" style="text-align: center; display: none;">
                <h3 style="color: var(--success-green); margin-bottom: 10px;">YOU GOT:</h3>
                <i class="fas fa-gift fa-5x" style="color: var(--primary-purple);"></i>
                <p style="font-size: 1.5em; font-weight: bold; color: var(--text-light); margin-top: 10px;" id="awardedItemName">
                    -- Item Name --
                </p>
                <button class="btn" onclick="claimAwardedItem()">
                    <i class="fas fa-check"></i> Claim to Inventory
                </button>
            </div>
        </div>
    </div>
    <!-- Модальное окно пополнения -->
    <div id="topUpModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="hideTopUpModal()">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="modal-title">Top-Up Balance</h2>
            <button class="btn" onclick="topUp('ton')">
                <i class="fas fa-coins"></i> TON (Bonus +10%)
            </button>
            <button class="btn" onclick="topUp('stars')">
                <i class="fas fa-star"></i> Звёзды (100 звезд = 1 TON)
            </button>
            <button class="btn" onclick="topUp('rub')">
                <i class="fas fa-ruble-sign"></i> СБП (105 руб = 1 TON)
            </button>
        </div>
    </div>
</body>
</html>
