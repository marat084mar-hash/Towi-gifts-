<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts - Кейсы</title>

    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" referrerpolicy="no-referrer">

    <!-- Стили -->
    <link rel="stylesheet" href="..style.css">

    <!-- Обязательные скрипты Telegram Web App -->
</head>
<body>
    <div class="container">
        <header class="app-header">
            <button class="back-button" onclick="window.history.back()">
                <i class="fas fa-chevron-left" aria-hidden="true"></i>
                <span class="sr-only">Вернуться назад</span>
            </button>
            <h1>Cases</h1>

            <!-- Блок баланса и пополнения -->
            <div class="balance-info">
                <button class="add-balance-btn" onclick="showTopUpModal()" aria-label="Пополнить баланс">
                    <i class="fas fa-plus" aria-hidden="true"></i>
                    Пополнить
                </button>
            </div>
        </header>

        <!-- Отображение текущего баланса и имени пользователя в шапке -->
        <div class="user-info">
            <span class="balance-text" id="balance">Balance: 0.00 TON</span>
            <span class="username-text" id="username">@guest</span>
        </div>

        <!-- Список кейсов -->
        <div id="casesListContainer" class="cases-grid">
            <p class="no-cases-message">
                No cases added yet. Add your custom cases here!
            </p>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПОПОЛНЕНИЯ БАЛАНСА -->
    <div id="topUpModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>

            <!-- Экран 1: Выбор способа пополнения -->
            <div id="paymentMethodScreen" class="screen active">
                <h2>Пополнение баланса</h2>
                <p>Выберите способ пополнения:</p>

                <div class="payment-options">
                    <div class="payment-option" data-method="ton">
                        <i class="fas fa-coins"></i>
                        <div>
                            <strong>TON</strong>
                            <span>Бонус +10 %</span>
                        </div>
                    </div>

            <div class="payment-option" data-method="stars">
                <i class="fas fa-star"></i>
                <div>
                    <strong>Stars</strong>
            <span>100 звёзд = 1 TON</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Экран 2: Ввод суммы -->
    <div id="amountScreen" class="screen">
        <h2 id="amountTitle"></h2>
        <input type="number" id="amountInput" placeholder="Введите сумму" min="0.1" step="0.01">

        <button id="actionButton" class="action-btn">
            <!-- Текст будет меняться динамически -->
        </button>

        <button id="backButton" class="back-btn">Назад</button>
    </div>
  </div>
</div>

<!-- Скрипты -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/config/supabase.js"></script>
<script type="module" src="js/global.js"></script>
<script src="js/cases.js"></script>
</body>
</html>
