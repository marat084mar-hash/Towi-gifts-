<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts - Кейсы</title>

    <!-- Обязательные скрипты -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" referrerpolicy="no-referrer">

    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Скрипты (ПРАВИЛЬНЫЙ ПОРЯДОК) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/config/supabase.js"></script>
    <script type="module" src="js/global.v2.js"></script>
    <script src="js/cases.js"></script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <button class="back-button" onclick="goBack()">
                <i class="fas fa-chevron-left" aria-hidden="true"></i>
                <span class="sr-only">Вернуться назад</span>
            </button>
            <h1>Cases</h1>

            <!-- Блок баланса и пополнения -->
            <div class="balance-info">
                <button class="add-balance-btn" onclick="showTopUpModal()" aria-label="Пополнить баланс">
                    <i class="fas fa-plus" aria-hidden="true"></i>
                    Пополнить
                </button>
            </div>
        </header>

        <!-- Отображение текущего баланса и имени пользователя в шапке -->
        <div class="user-info">
            <span class="balance-text" id="userBalance">Balance: 0.00 TON</span>
            <span class="username-text" id="username">@guest</span>
        </div>

        <!-- Список кейсов -->
        <div id="casesListContainer" class="card-grid">
            <p class="no-cases-message">
                No cases added yet. Add your custom cases here!
            </p>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПОПОЛНЕНИЯ БАЛАНСА -->
    <div id="topUpModal" class="modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="topUpModalTitle">
        <div class="modal-content">
            <span class="close-btn" aria-label="Закрыть окно" onclick="closeTopUpModal()">&times;</span>
            <h2 id="topUpModalTitle">Пополнение баланса</h2>


            <div class="payment-options">
                <button class="payment-option" data-method="ton">
                    <i class="fas fa-coins" aria-hidden="true"></i>
            <div>
                        <strong>TON</strong>
                <span>Бонус +10 %</span>
            </div>
                </button>

                <button class="payment-option" data-method="stars">
            <i class="fas fa-star" aria-hidden="true"></i>
            <div>
                <strong>Telegram Stars</strong>
                <span>100 звёзд = 1 TON</span>
            </div>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
