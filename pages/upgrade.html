<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts - Апгрейды</title>

    <!-- Скрипт Telegram Web App -->

    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" referrerpolicy="no-referrer">

    <!-- Стили -->
    <link rel="stylesheet" href="..style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <button class="back-button" onclick="history.back()" aria-label="Вернуться назад">
                <i class="fas fa-chevron-left" aria-hidden="true"></i>
                <span class="sr-only">Вернуться назад</span>
            </button>
            <h1 id="pageTitle"></h1>

            <!-- Блок баланса и пополнения в шапке -->
            <div class="balance-info" style="position: absolute; right: 20px; top: 15px;">
                <button class="add-balance-btn" onclick="showTopUpModal()" aria-label="Пополнить баланс">
                    <i class="fas fa-plus" aria-hidden="true"></i>
                    Пополнить
                </button>
            </div>
        </header>

        <!-- Отображение текущего баланса и имени пользователя в шапке -->
        <div style="text-align: right; margin-top: 10px; margin-bottom: 20px;">
            <span class="balance-text" id="userBalance" style="font-size: 18px;"></span><br>
            <span class="username-text" id="username" style="font-size: 14px;"></span>
        </div>

        <div class="upgrade-section">
            <div style="display: flex; justify-content: space-around; margin-bottom: 25px;">
                <button class="btn btn-secondary" style="width: 48%; margin-bottom: 0;" id="addGiftBtn">
                    <i class="fas fa-plus" aria-hidden="true"></i>
            <span id="addGiftText"></span>
                </button>
                <button class="btn btn-secondary" style="width: 48%; margin-bottom: 0;" id="chooseGiftBtn">
            <i class="fas fa-list-ul" aria-hidden="true"></i>
            <span id="chooseGiftText"></span>
                </button>
            </div>

            <p class="upgrade-chance">Chances of Success: <span id="successChance"></span></p>

            <div class="upgrade-wheel-container">
                <div class="wheel-indicator"></div>
                <div id="upgradeWheel" class="upgrade-wheel" style="transform: rotate(0deg);">
                    <!-- Секторы колеса будут динамически обновляться JS -->
                </div>
            </div>

            <button class="btn" onclick="startUpgrade()" id="upgradeBtn">
                <i class="fas fa-arrow-up" aria-hidden="true"></i>
            <span id="upgradeText"></span>
            </button>
        </div>
    </div>

    <!-- Модальное окно пополнения -->
    <div id="topUpModal" class="modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="topUpModalTitle">
        <div class="modal-content">
            <span class="close-btn" aria-label="Закрыть окно" onclick="closeTopUpModal()">&times;</span>
            <h2 id="topUpModalTitle"></h2>

            <div class="payment-options">
                <button class="payment-option" data-method="ton">
                    <i class="fas fa-coins" aria-hidden="true"></i>
            <div>
                        <strong id="paymentMethodTON"></strong>
                <span id="paymentBonusTON"></span>
            </div>
                </button>

                <button class="payment-option" data-method="stars">
            <i class="fas fa-star" aria-hidden="true"></i>
            <div>
                <strong id="paymentMethodStars"></strong>
                <span id="paymentRateStars"></span>
            </div>
                </button>
            </div>
        </div>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/config/supabase.js"></script>
    <script type="module" src="js/global.js"></script>
    <script src="js/upgrade.js"></script>
</body>
</html>
