<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts</title>
    <!-- Обязательный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключение твоих стилей -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Подключение иконок Font Awesome (теперь раскомментировано!) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Блок с балансом и аватаром -->
   <div class="balance-container">
    <!-- Сюда JS вставит <img> с аватаром -->
    <div>
        <span class="balance-label">Balance:</span>
        <h1 id="balance">0.00 TON</h1>
        <p id="username">@guest</p>
    </div>
    <button class="add-balance-btn">+</button>
</div>

    <!-- Блок навигационных кнопок -->
    <div class="nav-buttons">
        <!-- Используем иконки Font Awesome -->
        <a href="pages/cases.html" class="nav-btn">
            <i class="fas fa-gift"></i> Cases
        </a>
        <a href="pages/upgrade.html" class="nav-btn">
            <i class="fas fa-arrow-up"></i> Upgrades
        </a>
        <a href="pages/inventory.html" class="nav-btn">
            <i class="fas fa-box"></i> Inventory
        </a>
    </div>

    <!-- Подключение твоего глобального скрипта -->
    <script src="js/global.v2.js"></script>

    <div id="topUpModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Пополнение баланса</h2>

        <div class="payment-options">
            <button class="payment-option" data-method="ton">
                <i class="fas fa-coins"></i>
                <div>
                    <strong>TON</strong>
                    <span>Бонус +10 %</span>
                </div>
            </button>

            <button class="payment-option" data-method="stars">
                <i class="fas fa-star"></i>
                <div>
            <strong>Telegram Stars</strong>
            <span>100 звёзд = 1 TON</span>
                </div>
            </button>
        </div>
    </div>
</div>
</body>
</html>
