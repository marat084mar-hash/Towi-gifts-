<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Все ваши мета-теги, подключения стилей и т.д. -->
    <title>Towi Gifts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================= -->
    <!-- ОБЩАЯ ШАПКА - ОНА НИКОГДА НЕ МЕНЯЕТСЯ -->
    <!-- ============================================= -->
    <header class="header">
        <div class="user-profile">
            <img src="placeholder.jpg" alt="User Avatar" id="user-avatar" class="avatar">
            <div class="user-info">
                <span id="user-nickname">@nickname</span>
                <span class="balance" id="balance">0.00 TON</span>
            </div>
        </div>
        <button class="add-balance-btn" id="add-balance-btn">+</button>
    </header>

    <!-- ============================================= -->
    <!-- ГЛАВНЫЙ КОНТЕЙНЕР ДЛЯ ВСЕХ СТРАНИЦ -->
    <!-- ============================================= -->
    <main id="app-container">

        <!-- Секция 1: Главное меню (видна по умолчанию) -->
        <section id="page-main" class="page active">
            <nav class="main-nav">
                <button data-page="page-cases" class="nav-button">
                    <img src="src/img/cases_icon.png" alt=""> Cases
                </button>
                <button data-page="page-upgrades" class="nav-button">
                    <img src="src/img/upgrades_icon.png" alt=""> Upgrades
                </button>
                <button data-page="page-inventory" class="nav-button">
                    <img src="src/img/inventory_icon.png" alt=""> Inventory
                </button>
            </nav>
        </section>

        <!-- Секция 2: Кейсы (изначально скрыта) -->
        <section id="page-cases" class="page">
            <!-- Сюда вставляете ВЕСЬ КОНТЕНТ из body файла cases.html -->
            <!-- Например: -->
            <h2>Кейсы</h2>
            <div class="cases-grid">
                <!-- ... ваши карточки кейсов ... -->
            </div>
        </section>

        <!-- Секция 3: Апгрейды (изначально скрыта) -->
        <section id="page-upgrades" class="page">
            <!-- Сюда вставляете ВЕСЬ КОНТЕНТ из body файла upgrade.html -->
        </section>

        <!-- Секция 4: Инвентарь (изначально скрыта) -->
        <section id="page-inventory" class="page">
            <!-- Сюда вставляете ВЕСЬ КОНТЕНТ из body файла inventory.html -->
        </section>

    </main>

    <!-- Модальное окно для пополнения (изначально скрыто) -->
    <div id="add-balance-modal" class="modal">
        <!-- ... контент вашего модального окна ... -->
    </div>


    <!-- Подключаем скрипты -->
    <script src="config/supabase.js" type="module"></script>
    <script src="js/main-router.js" type="module"></script> <!-- Новый главный скрипт -->
    <!-- ... остальные скрипты ... -->

</body>
</html>
