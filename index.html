<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts — Главная</title>

    <!-- Скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" referrerpolicy="no-referrer" />

    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Скрипты (правильный порядок) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global.v2.js"></script>
</head>
<body>
    <div class="container">
        <!-- Блок баланса и профиля пользователя -->
        <div class="balance-info">
            <div class="user-profile" id="userProfile">
                <img id="userAvatar" src="" alt="Аватар пользователя" style="border-radius: 50%; width: 30px; height: 30px; object-fit: cover; border: 2px solid #555;">
                <span class="username-text" id="username">@guest</span>
                <span class="user-id" id="userId"></span>
            </div>
            <div>
                <span class="balance-text" id="userBalance">Balance: 0.00 TON</span>
            </div>
            <button class="add-balance-btn" onclick="showTopUpModal()">
                <i class="fas fa-plus"></i> Пополнить
            </button>
        </div>

        <!-- Кнопки навигации -->
        <div class="main-menu-buttons">
            <a href="cases.html" class="btn">
                <i class="fas fa-box-open"></i> Cases
            </a>
            <a href="upgrade.html" class="btn">
                <i class="fas fa-arrow-up"></i> Upgrades
            </a>
            <a href="inventory.html" class="btn">
                <i class="fas fa-boxes-stacked"></i> Inventory
            </a>
        </div>
    </div>

    <!-- Модальное окно пополнения -->
    <div id="topUpModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="hideTopUpModal()">
                <i class="fas fa-times"></i> Закрыть
            </button>
            <h2 class="modal-title">Пополнение баланса</h2>
            <button class="btn" onclick="topUp('ton')">
                <i class="fas fa-coins"></i> TON (бонус +10%)
            </button>
            <button class="btn" onclick="topUp('stars')">
                <i class="fas fa-star"></i> Звёзды (100 звёзд = 1 TON)
            </button>
            <button class="btn" onclick="topUp('rub')">
                <i class="fas fa-ruble-sign"></i> СБП (105 руб = 1 TON)
            </button>
        </div>
    </div>

    <!-- Скрипт для загрузки данных пользователя (добавить перед закрывающим тегом body) -->
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Здесь должен быть код для получения данных пользователя из Telegram/Supabase
            const userData = await getUserData(); // Ваша функция для получения данных

            if (userData) {
                document.getElementById('userAvatar').src = userData.avatar_url;
                document.getElementById('username').textContent = `@${userData.username}`;
                document.getElementById('userId').textContent = `ID: ${userData.telegram_id}`;
            }
        });

        // Пример функции получения данных (замените на ваш код)
        async function getUserData() {
            // Ваш код для получения userData из Supabase/Telegram
            return {
                avatar_url: 'https://example.com/avatar.jpg', // замените на реальный URL
                username: 'example_user',
                telegram_id: '123456789'
            };
        }
    </script>
</body>
</html>
