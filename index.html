    <div id="loading-screen">
        <h1>Towi Gifts</h1>
        <div class="spinner"></div>
        <p style="font-size: 0.5em; margin-top: 20px;">Загрузка...</p>
    </div>

    <div id="main-content">
        <header>
            <h1>Мои Подарки</h1>
        </header>

        <main>
            <p>Здесь вы можете открывать полученные подарки!</p>
            <div id="inventory-grid">
            </div>
            
            <button id="closeButton">Закрыть приложение</button>

            <p>&copy; 2025 Towi Gifts. Все права защищены.</p>

    <script src="script.js"></script>

    <script>
        function isLightColor(color) {
            if (!color) return false;
            const hex = color.startsWith('#') ? color.slice(1) : color;
            if (hex.length !== 6) return false;
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            return (r * 299 + g * 587 + b * 114) / 1000 > 186; 
        }

        function applyTheme() {
            const themeParams = Telegram.WebApp.themeParams;
            const body = document.body;
            if (themeParams.bg_color) {
                document.documentElement.style.setProperty('--bg-color', themeParams.bg_color);
                
                if (isLightColor(themeParams.bg_color)) {
                    body.classList.add('light-theme');
                    document.documentElement.style.setProperty('--text-color', themeParams.text_color || '#1a1a1a');
                    document.documentElement.style.setProperty('--primary-color', themeParams.button_color || '#8A2BE2');
                    document.documentElement.style.setProperty('--secondary-bg-color', themeParams.secondary_bg_color || '#f0f0f0');
                    document.documentElement.style.setProperty('--border-color', themeParams.hint_color || '#ccc');
                    document.documentElement.style.setProperty('--button-bg', themeParams.button_color || '#8A2BE2');
                } else {
                    body.classList.remove('light-theme');
                    document.documentElement.style.setProperty('--text-color', themeParams.text_color || '#e0e0e0');
                    document.documentElement.style.setProperty('--primary-color', themeParams.button_color || '#A020F0');
                    document.documentElement.style.setProperty('--secondary-bg-color', themeParams.secondary_bg_color || '#1a0026');
                    document.documentElement.style.setProperty('--border-color', themeParams.hint_color || '#58189e');
                    document.documentElement.style.setProperty('--button-bg', themeParams.button_color || '#8A2BE2');
                }
            }
            
            if (Telegram.WebApp.setHeaderColor && themeParams.header_bg_color) {
                Telegram.WebApp.setHeaderColor(themeParams.header_bg_color);
            }
            if (Telegram.WebApp.setBackgroundColor && themeParams.bg_color) {
                Telegram.WebApp.setBackgroundColor(themeParams.bg_color);
            }
        }


        document.addEventListener('DOMContentLoaded', () => {
            const loadingScreen = document.getElementById('loading-screen');
            const mainContent = document.getElementById('main-content');

            if (Telegram.WebApp.ready) {
                console.log('Telegram Web App SDK готов!');
                Telegram.WebApp.expand();

                if (typeof loadInventory === 'function') loadInventory();
                if (typeof applyTheme === 'function') applyTheme();
                if (typeof displayInventory === 'function') displayInventory();

                Telegram.WebApp.onEvent('themeChanged', applyTheme);

                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    mainContent.style.display = 'flex';
                }, 1000);
                
                const closeButton = document.getElementById('closeButton');
                if (closeButton) {
                    closeButton.addEventListener('click', () => {
                        Telegram.WebApp.close();
                    });
                }

                console.log('Имя пользователя:', Telegram.WebApp.initDataUnsafe?.user?.first_name);
                console.log('Параметры темы:', Telegram.WebApp.themeParams);

            } else {
                console.error('Telegram Web App SDK не загружен. Возможно, приложение открыто вне Telegram.');
                loadingScreen.style.display = 'none';
                mainContent.style.display = 'flex'; 
            }
        });
    </script>
</body>
