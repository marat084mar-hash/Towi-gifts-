<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts — Главная</title>

    <!-- Скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" referrerpolicy="no-referrer" />

    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Скрипты (правильный порядок) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="global.v2.js" type="module"></script>
</head>
<body>
    <div class="container">
        <!-- Блок баланса и профиля пользователя -->
        <div class="balance-info">
            <div class="user-profile">
                <img id="userAvatar" src="default-avatar.png" alt="Аватар пользователя" class="profile-avatar">
                <span class="username-text" id="username">@guest</span>
            </div>
            <span class="balance-text" id="userBalance">Balance: 0.00 TON</span>
            <button class="add-balance-btn" onclick="showTopUpModal()">
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <!-- Кнопки навигации -->
        <div class="main-menu-buttons">
            <a href="cases.html" class="btn">
                <i class="fas fa-box-open"></i> Cases
            </a>
            <a href="upgrade.html" class="btn">
                <i class="fas fa-arrow-up"></i> Upgrades
            </a>
            <a href="inventory.html" class="btn">
                <i class="fas fa-boxes-stacked"></i> Inventory
            </a>
        </div>
    </div>

    <!-- Модальное окно пополнения -->
    <div id="topUpModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="hideTopUpModal()">
                <i class="fas fa-times"></i> Закрыть
            </button>
            <h2 class="modal-title">Пополнение баланса</h2>
            <button class="btn" onclick="topUp('ton')">
                <i class="fas fa-coins"></i> TON (бонус +10%)
            </button>
            <button class="btn" onclick="topUp('stars')">
                <i class="fas fa-star"></i> Звёзды (100 звёзд = 1 TON)
            </button>
            <button class="btn" onclick="topUp('rub')">
                <i class="fas fa-ruble-sign"></i> СБП (105 руб = 1 TON)
            </button>
        </div>
    </div>

    <!-- Скрипт для загрузки данных пользователя -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Получаем данные пользователя Telegram
                const tg = window.Telegram.WebApp;
                const telegramUser = {
                    id: tg.initDataUnsafe?.user?.id,
                    username: tg.initDataUnsafe?.user?.username,
                    photo_url: tg.initDataUnsafe?.user?.photo_url
                };

                if (!telegramUser.id) {
                    console.warn('Данные пользователя Telegram не доступны');
                    return;
                }

                // Вызываем функцию из global.v2.js для загрузки профиля
                await loadUserProfile(telegramUser);

            } catch (error) {
                console.error('Ошибка при загрузке данных пользователя:', error);
            }
        });

        // Функция показа модального окна пополнения
        function showTopUpModal() {
            document.getElementById('topUpModal').classList.add('active');
        }

        // Функция скрытия модального окна пополнения
        function hideTopUpModal() {
            document.getElementById('topUpModal').classList.remove('active');
        }
    </script>
</body>
</html>
