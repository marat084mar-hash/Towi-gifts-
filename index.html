<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts - Главная</title> <!-- Или другое название страницы -->
    
    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome 6 (обновленная ссылка без integrity!) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" referrerpolicy="no-referrer" />
    
    <!-- Основные стили CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Скрипт CDN для Supabase JS (ДОЛЖЕН БЫТЬ ПЕРЕД global.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- ГЛОБАЛЬНЫЙ JAVASCRIPT ДЛЯ МОДАЛЬНОГО ОКНА И UI -->
    <script src="js/global.js"></script>

    <!-- Если для этой страницы нужен специфический JS, добавь его после global.js -->
    <!-- <script src="js/cases.js"></script> --> 
</head>
<body>
    <div class="container">
        <!-- Блок баланса и пополнения (ТЕПЕРЬ НА ВСЕХ СТРАНИЦАХ) -->
        <div class="balance-info">
            <div>
                <span class="balance-text" id="userBalance">Balance: 0.00 TON</span><br>
                <span class="username-text" id="username">@guest</span>
            </div>
            <button class="add-balance-btn" onclick="showTopUpModal()">
                <i class="fas fa-plus"></i>
            </button>
        </div>

        <!-- Кнопки навигации -->
        <div class="main-menu-buttons">
            <a href="cases.html" class="btn">
                <i class="fas fa-box-open"></i> Cases
            </a>
            <a href="upgrade.html" class="btn">
                <i class="fas fa-arrow-up"></i> Upgrades
            </a>
            <a href="inventory.html" class="btn">
                <i class="fas fa-boxes-stacked"></i> Inventory
            </a>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПОПОЛНЕНИЯ БАЛАНСА (ТЕПЕРЬ НА ВСЕХ СТРАНИЦАХ) -->
    <div id="topUpModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="hideTopUpModal()">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="modal-title">Top-Up Balance</h2>
            <button class="btn" onclick="topUp('ton')">
                <i class="fas fa-coins"></i> TON (Bonus +10%)
            </button>
            <button class="btn" onclick="topUp('stars')">
                <i class="fas fa-star"></i> Звёзды (100 звезд = 1 TON)
            </button>
            <button class="btn" onclick="topUp('rub')">
                <i class="fas fa-ruble-sign"></i> СБП (105 руб = 1 TON)
            </button>
        </div>
    </div>
</body>
</html>
