<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melon Gifts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Верхняя панель: Балансы и пополнение -->
        <header class="top-panel">
            <div class="balance-info">
                <span class="balance-item">TON: <span id="ton-balance">0.00</span> 💎</span>
                <span class="balance-item">Stars: <span id="stars-balance">0</span> ⭐</span>
            </div>
            <button class="replenish-button">+</button>
        </header>

        <!-- Главный экран навигации -->
        <div id="main-menu-screen" class="screen active">
            <div class="main-navigation">
                <button class="nav-button large" data-target-screen="rocket-crash-screen">🚀 РАКЕТ КРАШ</button>
                <button class="nav-button large" data-target-screen="cases-screen">🎁 КЕЙСЫ</button>
            </div>
        </div>

        <!-- Секция "Кейсы" -->
        <div id="cases-screen" class="screen">
            <h2>🎁 Ваши Кейсы</h2>
            <div class="cases-grid" id="cases-grid">
                <!-- Кейсы будут загружены сюда через JavaScript -->
            </div>
            <button class="back-button" data-target-screen="main-menu-screen">← Назад</button>
        </div>

        <!-- Секция "Ракет Краш" -->
        <div id="rocket-crash-screen" class="screen">
            <h2>🚀 Ракет Краш</h2>
            <div class="crash-game-area">
                <div class="rocket-display">
                    <span id="rocket-emoji">🚀</span>
                    <span id="multiplier-display">1.00x</span>
                </div>
                <div class="game-status" id="game-status">Ожидание...</div>
                <div class="game-controls">
                    <button id="start-round-button" class="action-button primary">Начать Раунд</button>
                    <button id="cash-out-button" class="action-button secondary" disabled>Вывести</button>
                    <input type="number" id="bet-input" placeholder="Ставка" value="10" min="1">
                </div>
            </div>
            <button class="back-button" data-target-screen="main-menu-screen">← Назад</button>
        </div>

        <!-- Секция "Инвентарь" -->
        <div id="inventory-screen" class="screen">
            <h2>🎒 Ваш Инвентарь</h2>
            <ul id="inventory-list" class="inventory-list">
                <!-- Элементы инвентаря будут загружены сюда через JavaScript -->
            </ul>
            <button class="back-button" data-target-screen="main-menu-screen">← Назад</button>
        </div>

        <!-- Нижняя навигация (всегда видна) -->
        <footer class="bottom-nav">
            <button class="nav-button" data-target-screen="main-menu-screen">🏠 Главная</button>
            <button class="nav-button" data-target-screen="inventory-screen">🎒 Инвентарь</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
                </html>
