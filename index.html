<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts</title>
    <!-- Обязательный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключение твоих стилей -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Подключение иконок Font Awesome (теперь раскомментировано!) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Блок с балансом и аватаром -->
   <div class="balance-container">
    <!-- Сюда JS вставит <img> с аватаром -->
    <div>
        <span class="balance-label">Balance:</span>
        <h1 id="balance">0.00 TON</h1>
        <p id="username">@guest</p>
    </div>
    <button class="add-balance-btn">+</button>
</div>

    <!-- Блок навигационных кнопок -->
    <div class="nav-buttons">
        <!-- Используем иконки Font Awesome -->
        <a href="pages/cases.html" class="nav-btn">
            <i class="fas fa-gift"></i> Cases
        </a>
        <a href="pages/upgrade.html" class="nav-btn">
            <i class="fas fa-arrow-up"></i> Upgrades
        </a>
        <a href="pages/inventory.html" class="nav-btn">
            <i class="fas fa-box"></i> Inventory
        </a>
    </div>

    <!-- Модальное окно пополнения (всегда в самом низу body) -->
    <div id="deposit-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Top Up Balance</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="payment-list">
                <button class="pay-option ton" onclick="pay('ton')">
                    <img src="https://ton.org/download/ton_symbol.png" alt="TON"> TON Coin
                </button>
                <button class="pay-option stars" onclick="pay('stars')">
                    <img src="https://telegram.org/img/t_logo.png" alt="Stars"> Telegram Stars
                </button>
                <button class="pay-option sbp" onclick="pay('sbp')">
                    <span class="pay-icon">💳</span> СБП / Карта
                </button>
            </div>
        </div>
    </div>

    <!-- Подключение твоего глобального скрипта -->
    <script src="js/global.v2.js"></script>
</body>
</html>
