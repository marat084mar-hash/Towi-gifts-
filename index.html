<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts</title>
    <link rel="stylesheet" href="style.css">
    <!-- Иконки (например, с Boxicons) -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    
    <header class="app-header">
        <div class="user-profile">
            <img id="user-avatar" src="https://i.pravatar.cc/150" alt="Avatar" class="avatar">
            <div>
                <span id="user-balance-value">0.00 TON</span>
                <span id="user-username">@username</span>
            </div>
        </div>
        <div class="balance-controls">
            <button id="deposit-btn" title="Пополнить баланс">+</button>
        </div>
    </header>

    <main>
<div class="main-menu">
    <a href="pages/cases.html" class="menu-button"> <!-- Убрали / -->
        <i class='bx bxs-box icon'></i>
        <span>Cases</span>
    </a>
    <a href="pages/upgrade.html" class="menu-button"> <!-- Убрали / -->
        <i class='bx bxs-up-arrow-circle icon'></i>
        <span>Upgrades</span>
    </a>
    <a href="pages/inventory.html" class="menu-button"> <!-- Убрали / -->
        <i class='bx bxs-briefcase-alt-2 icon'></i>
        <span>Inventory</span>
    </a>
</div>
    </main>

    <!-- Модальное окно для пополнения -->
    <div id="deposit-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Пополнение баланса</h2>
            <p>Выберите способ оплаты:</p>
            <div class="payment-options">
                <button id="pay-ton-btn" class="payment-button">
                    Пополнить через TON
                    <span class="bonus">+10% бонус к пополнению!</span>
                </button>
                <button id="pay-stars-btn" class="payment-button">
                    Пополнить через Telegram Stars
                    <span class="bonus">Вывод заблокирован на 21 день</span>
                </button>
            </div>
            <button id="close-modal-btn" style="margin-top: 20px;">Закрыть</button>
        </div>
    </div>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="config/supabase.js"></script>
    <script src="js/global.js"></script>
</body>
</html>
