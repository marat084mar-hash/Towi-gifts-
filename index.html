<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- Обязательный скрипт для Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Шапка приложения с информацией о пользователе и балансом -->
        <header class="app-header">
            <div class="user-info">
                <img src="https://via.placeholder.com/40/00ff00/FFFFFF?text=AV" alt="Аватар" class="user-avatar">
                <div class="user-details">
                    <span id="user-display-name">Загрузка...</span>
                    <span id="user-ton-balance" class="balance-text">0.00 TON</span>
                </div>
            </div>
            <!-- Кнопка "Пополнить TON" будет вызывать окно покупки Stars -->
            <button class="top-up-button" onclick="promptForStarsPurchase();">Пополнить TON</button>
        </header>

        <!-- Основное содержимое приложения (различные разделы) -->
        <main class="app-main">
            <!-- Раздел Краш-игры -->
            <div id="crash-game-section" class="section active">
                <h2>🚀 Краш-игра</h2>
                <div class="crash-display">
                    <div id="current-multiplier" class="multiplier-text">1.00x</div>
                    <div class="game-area">
                        <!-- Изображение ракеты -->
                        <img src="https://via.placeholder.com/150/00ff00/FFFFFF?text=РАКЕТА" alt="Ракета" class="game-visual">
                    </div>
                </div>
                <div class="controls">
                    <button class="button primary" onclick="startGame()">Сделать ставку (1 TON)</button>
                    <button class="button secondary" onclick="cashOut()">Забрать (x2.00)</button>
                </div>
                <div id="crash-game-log" class="game-log">
                    <h3>История раундов:</h3>
                    <!-- Логи раундов будут загружаться сюда через JavaScript -->
                </div>
            </div>

            <!-- Раздел Открытия Кейсов -->
            <div id="cases-section" class="section">
                <h2>📦 Открытие Кейсов</h2>
                <div id="cases-list" class="cases-grid">
                    <!-- Кейсы будут загружены сюда через JavaScript -->
                    <p>Загрузка кейсов...</p>
                </div>
                <div id="case-result" class="game-log"></div>
            </div>

<!-- Раздел Профиля Пользователя -->
            <div id="profile-section" class="section">
                <h2>👤 Мой Профиль</h2>
                <p>Ваш Telegram ID: <span id="profile-telegram-id"></span></p>
                <p>Ваш Username: <span id="profile-telegram-username"></span></p>
                <p>Баланс TON: <span id="profile-ton-balance">0.00</span></p>
                
                <h3>Мой TON кошелек для вывода:</h3>
                <input type="text" id="ton-wallet-input" placeholder="Введите адрес вашего TON кошелька">
                <button class="button primary" onclick="saveTonWalletAddress()">Сохранить адрес</button>
                <p id="wallet-status"></p>

                <h3>Мой Инвентарь NFT:</h3>
                <div id="nft-inventory-list" class="cases-grid">
                    <!-- NFT пользователя будут загружены сюда через JavaScript -->
                    <p>Инвентарь пуст или загружается...</p>
                </div>
            </div>
        </main>

        <!-- Нижняя навигационная панель -->
        <nav class="app-nav">
            <button class="nav-item active" data-section="crash-game-section">
                <img src="https://img.icons8.com/ios-filled/24/00ff00/rocket.png" alt="Играть">
                <span>Играть</span>
            </button>
            <button class="nav-item" data-section="cases-section">
                <img src="https://img.icons8.com/ios-filled/24/00ff00/box.png" alt="Кейсы">
                <span>Кейсы</span>
            </button>
            <button class="nav-item" data-section="profile-section">
                <img src="https://img.icons8.com/ios-filled/24/00ff00/user.png" alt="Профиль">
                <span>Профиль</span>
            </button>
        </nav>
    </div>

    <!-- Основной JavaScript файл -->
    <script src="script.js"></script>
</body>
</html>
