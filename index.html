<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Минимальный Тест</title>
    <!-- Просто минимальные стили для кнопки и окна -->
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0A0A1A; /* Темный фон */
            color: #E0E0E0; /* Светлый текст */
        }
        .add-balance-btn {
            background-color: #A358C8; /* Фиолетовый */
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 30px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }
        .add-balance-btn:hover {
            background-color: #7D32A8; /* Темнее фиолетовый */
        }

        /* Стили для модального окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7); /* Полупрозрачный черный фон */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: #1A1A1A; /* Темно-серый фон окна */
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            color: #E0E0E0;
            text-align: center;
        }
        .modal-content button {
            background-color: #A358C8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .modal-content button:hover {
            background-color: #7D32A8;
        }
    </style>
</head>
<body>
    <h1>Минимальный тест кнопки</h1>
    <button class="add-balance-btn" onclick="showTopUpModal()">
        +
    </button>
