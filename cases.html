<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Кейсы - Towi Gifts</title>
</head>
<body>
    <!-- HEADER -->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="index.html" class="navlogo">Towi Gifts</a>
            <div class="navmenu" id="nav-menu">
                <ul class="navlist">
                    <!-- Ссылки на другие страницы -->
                    <li class="navitem"><a href="index.html" class="navlink">Главная</a></li>
                    <li class="navitem"><a href="cases.html" class="navlink active-link">Кейсы</a></li>
                    <li class="navitem"><a href="inventory.html" class="navlink">Инвентарь</a></li>
                    <li class="navitem"><a href="upgrade.html" class="navlink">Апгрейд</a></li>

                <div class="navclose" id="nav-close"><i class="ri-close-line"></i></div>
            </div>
            <div class="nav__toggle" id="nav-toggle"><i class="ri-menu-line"></i></div>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="main">
        <!-- ЗАГЛУШКА ДЛЯ ОБЫЧНОГО БРАУЗЕРА -->
        <div id="non-telegram-placeholder" style="display: none; text-align: center; padding: 50px; color: var(--text-color);">
            <h1>👋 Привет!</h1>
            <p>Это веб-приложение для Telegram. Для полноценной работы, пожалуйста, откройте его через бота <a href="https://t.me/Towigifts_bot" style="color: var(--first-color);">@Towigifts_bot</a>.</p>
        </div>
        <!-- ОСНОВНОЙ КОНТЕЙНЕР ПРИЛОЖЕНИЯ -->
        <div id="app-container" style="display: none;">
            <section class="cases section container" id="cases">
                <h2 class="sectiontitle-center">Кейсы</h2>
                <div class="casescontainer grid">
                    <!-- Сюда будут загружаться кейсы из JS -->
                    <!-- Пример того, как это будет выглядеть после загрузки:
                    <article class="casescard">
                        <img src="assets/img/case-placeholder.png" alt="image" class="casesimg">
                        <div class="casesdata">
                            <h3 class="casesname">Название кейса</h3>
                            <span class="casesprice">100 ₽</span>
                            <button class="button casesbutton">Открыть</button>
                        </div>
                    </article>
                    -->
                </div>
            </section>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer section">
        <!-- ... твой футер ... -->
    </footer>

    <!-- TELEGRAM SCRIPT -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- SUPABASE & GLOBAL SCRIPT -->
    <!-- Важно: сначала global, потом cases! -->
    <script src="assets/js/global.v2.js" type="module"></script>
    <script src="assets/js/cases.v2.js" type="module"></script>
</body>
</html>
