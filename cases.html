<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts</title>
    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (latest version) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0jG30b+Z8lGj+d/2hXfV5Rz5k1mXw/YvQ7D9A4Pz+Z5E5w3M9J5A9M5x5A5Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="back-button"><<</a>
            <h1 class="page-title">Кейсы</h1>
            <div class="balance-info">
                <span id="balance">Баланс: 0.00 TON</span>
            </div>
        </header>
                <main class="main-content">
            <div id="cases-grid" class="cases-grid">
                <!-- Кейсы будут загружены сюда через cases.js -->
                <div class="case-card">
                    <div class="case-icon">🚬</div>
                    <div class="case-name">Кейс 1</div>
                    <div class="case-price">Открыть - 5 TON</div>
                    <button class="button open-single-case" data-case-id="1">Открыть</button>
                </div>
                 <div class="case-card">
                    <div class="case-icon">🐱</div>
                    <div class="case-name">Кейс 2</div>
                    <div class="case-price">Открыть - 10 TON</div>
                    <button class="button open-single-case" data-case-id="2">Открыть</button>
                </div>
                 <div class="case-card">
                    <div class="case-icon">💎</div>
                    <div class="case-name">Кейс 3</div>
                    <div class="case-price">Открыть - 15 TON</div>
                    <button class="button open-single-case" data-case-id="3">Открыть</button>
                </div>
                <div class="case-card">
                    <div class="case-icon">🐻</div>
                    <div class="case-name">Кейс 4</div>
                    <div class="case-price">Открыть - 20 TON</div>
                    <button class="button open-single-case" data-case-id="4">Открыть</button>
                </div>
            </div>

            <div class="multi-open-section">
                <h2>Мульти-открытие</h2>
                <div class="multi-open-options">
                    <label for="multi-case-select">Выберите кейс:</label>
                    <select id="multi-case-select">
                        <!-- Опции будут загружены через cases.js -->
                    </select>
                    <label for="open-count">Количество:</label>
                    <select id="open-count">
                        <option value="1">x1</option>
                        <option value="2">x2</option>
                        <option value="3">x3</option>
                        <option value="4">x4</option>
                        <option value="5">x5</option>
                    </select>
                    <button id="open-multi-cases-button" class="button">Открыть выбранные</button>
                </div>
            </div>

            <div id="result-modal" class="modal">
                <div class="modal-content">
                    <span class="close-button">&times;</span>
                    <h2>Ваш подарок!</h2>
                    <p id="gift-display"></p>
                    <button class="button" onclick="document.getElementById('result-modal').style.display='none'">Отлично!</button>
                </div>
            </div>

        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
    <script src="cases.js"></script>
</body>
</html>
