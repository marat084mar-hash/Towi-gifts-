<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts - Кейсы</title>
    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (ОБНОВЛЕННАЯ ССЫЛКА - без integrity!) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <!-- Кнопка "назад" -->
            <button class="back-button" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Cases</h1>
        </header>

        <!-- Здесь будет твой список кейсов.
             Ты можешь добавлять карточки, используя класс "card".
             Пример:
             <div class="card-grid">
                 <div class="card" onclick="openMyCustomCase('case1')">
                     <i class="icon fas fa-gem"></i>
                     <p class="text-label">My First Case</p>
                     <p class="price">Open - 10 TON</p>
                 </div>
                 <div class="card" onclick="openMyCustomCase('case2')">
                     <i class="icon fas fa-box-open"></i>
                     <p class="text-label">Another Case</p>
                     <p class="price">Open - 25 TON</p>
                 </div>
             </div>
        -->
        <div id="casesListContainer" class="card-grid" style="margin-top: 30px;">
            <p style="text-align: center; color: var(--text-muted); width: 100%;">
                No cases added yet. Add your custom cases here!
            </p>
        </div>

    </div>

    <!-- Встроенный JS для примера, если захочешь добавить кейсы позже -->
    <script>
        function openMyCustomCase(caseId) {
            alert(`Открываем пользовательский кейс: ${caseId}`);
            // Здесь будет твоя логика для открытия кейсов
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Здесь можно будет динамически добавлять кейсы, когда они появятся в базе данных
            // Например: fetch('/api/get_cases').then(response => response.json()).then(cases => { ... });
            // Или просто вручную добавить их в HTML
        });
    </script>
</body>
</html>
