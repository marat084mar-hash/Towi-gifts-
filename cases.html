<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts - Кейсы</title>
    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0jG30b+Z8lGj+d/2hXfV5Rz5k1mXw/YvQ7D9A4Pz+Z5E5w3M9J5A9M5x5A5Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <button class="back-button" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Cases</h1>
        </header>

        <div style="text-align: center; margin-top: 30px;">
            <p style="margin-bottom: 20px; font-size: 16px; color: var(--text-muted);">
                Open multiple cases to find rare Telegram Gifts!
            </p>

            <div class="input-group" style="max-width: 250px; margin: 0 auto 25px;">
                <label for="casesQuantity">Quantity to open:</label>
                <input type="number" id="casesQuantity" class="input-field" value="1" min="1" max="50">
            </div>

            <button class="btn" onclick="openMultiCases()">
                <i class="fas fa-treasure-chest"></i> Open Cases
            </button>

            <div id="caseResults" style="margin-top: 30px; text-align: left;">
                <!-- Здесь будут отображаться результаты открытия кейсов -->
                <h3 style="color: var(--primary-purple); margin-bottom: 15px;">Your Winnings:</h3>
                <ul id="winningsList" style="list-style: none; padding: 0;">
                    <!-- Пример: <li><i class="fas fa-gift"></i> Rare NFT Gift</li> -->
                </ul>
            </div>
        </div>
    </div>

    <script src="js/cases.js"></script>
</body>
</html>
