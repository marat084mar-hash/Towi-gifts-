<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts</title>
    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (latest version) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0jG30b+Z8lGj+d/2hXfV5Rz5k1mXw/YvQ7D9A4Pz+Z5E5w3M9J5A9M5x5A5Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="back-button"><<</a>
            <h1 class="page-title">Пополнение баланса</h1>
            <div class="balance-info">
                <span id="balance">Баланс: 0.00 TON</span>
            </div>
        </header>

        <main class="main-content">
            <div class="top-up-section">
                <h2>Ваш текущий баланс: <span id="current-balance-display">0.00 TON</span></h2>

                <div class="top-up-option">
                    <h3>Пополнение через TON</h3>
                    <p>+10% к пополнению</p>
                    <input type="number" id="ton-amount" placeholder="Введите TON" min="1">
                    <button id="top-up-ton-button" class="button">Пополнить через TON</button>
                    <p class="conversion-info">Вы получите: <span id="ton-get-amount">0.00</span> TON</p>
                </div>

                <div class="top-up-option">
                    <h3>Пополнение через Telegram Stars</h3>
                    <p>100 Звезд = 1 TON</p>
                    <input type="number" id="stars-amount" placeholder="Введите количество Звезд" min="100">
                    <button id="top-up-stars-button" class="button">Пополнить через Звезды</button>
                    <p class="conversion-info">Вы получите: <span id="stars-get-ton-amount">0.00</span> TON</p>
                </div>

                <div class="top-up-option">
                    <h3>Пополнение через СБП (Рубли)</h3>
                    <p>105 RUB = 1 TON</p>
                    <input type="number" id="rub-amount" placeholder="Введите сумму в RUB" min="105">
                    <button id="top-up-sbp-button" class="button">Пополнить через СБП</button>
                    <p class="conversion-info">Вы получите: <span id="rub-get-ton-amount">0.00</span> TON</p>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
    <script src="wallet.js"></script>
</body>
</html>
``
