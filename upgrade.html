<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts</title>
    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (latest version) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0jG30b+Z8lGj+d/2hXfV5Rz5k1mXw/YvQ7D9A4Pz+Z5E5w3M9J5A9M5x5A5Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="back-button"><<</a>
            <h1 class="page-title">Апгрейды</h1>
            <div class="balance-info">
                <span id="balance">Баланс: 0.00 TON</span>
            </div>
        </header>
               <main class="main-content">
            <div class="upgrade-section">
                <h2>Ваши подарки</h2>
                <div id="user-gifts-list" class="user-gifts-list">
                    <!-- Подарки пользователя будут загружены сюда -->
                    <div class="gift-item">
                        <span>Название подарка #1</span>
                        <button class="button select-gift-for-upgrade" data-gift-id="1">Выбрать</button>
                    </div>
                </div>

                <h2>Выбранный подарок для апгрейда:</h2>
                <div id="selected-gift-info" class="selected-gift-info">
                    <p>Пока не выбрано.</p>
                </div>

                <div class="upgrade-controls">
                    <div class="chances-display">
                        Шанс успеха: <span id="success-chance">75%</span>
                    </div>
                    <div class="upgrade-wheel">
                        <!-- Здесь можно встроить SVG или canvas для колеса шансов, для простоты пока текст -->
                        <img src="wheel.png" alt="Upgrade Wheel" style="max-width: 100%; height: auto; display: none;"> <!-- Пример, если будет картинка -->
                    </div>
                    <button id="perform-upgrade-button" class="button" disabled>Апгрейд!</button>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
    <script src="upgrade.js"></script>
</body>
</html>
