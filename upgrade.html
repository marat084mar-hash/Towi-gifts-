<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Towi Gifts - Апгрейды</title>
    
    <!-- Скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" referrerpolicy="no-referrer" />
    
    <!-- Стили -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Скрипты (ПРАВИЛЬНЫЙ ПОРЯДОК) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global.v2.js"></script> <!-- ИМЯ ФАЙЛА ИЗМЕНЕНО -->
    <!-- <script src="js/upgrade.js"></script> --> <!-- Оставлено закомментированным пока не понадобится -->
</head>
<body>
    <div class="container">
        <header class="app-header">
            <button class="back-button" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
            <h1>Upgrades</h1>
            <!-- Блок баланса и пополнения в шапке -->
            <div class="balance-info" style="position: absolute; right: 20px; top: 15px;">
                <button class="add-balance-btn" onclick="showTopUpModal()">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </header>

        <!-- Отображение текущего баланса и имени пользователя в шапке -->
        <div style="text-align: right; margin-top: 10px; margin-bottom: 20px;">
            <span class="balance-text" id="userBalance" style="font-size: 18px;">Balance: 0.00 TON</span><br>
            <span class="username-text" id="username" style="font-size: 14px;">@guest</span>
        </div>

        <div class="upgrade-section">
            <div style="display: flex; justify-content: space-around; margin-bottom: 25px;">
                <button class="btn btn-secondary" style="width: 48%; margin-bottom: 0;">
                    <i class="fas fa-plus"></i> Add Gift
                </button>
                <button class="btn btn-secondary" style="width: 48%; margin-bottom: 0;">
                    <i class="fas fa-list-ul"></i> Choose Gift
                </button>
            </div>

            <p class="upgrade-chance">Chances of Success: <span id="successChance">0%</span></p>

            <div class="upgrade-wheel-container">
                <div class="wheel-indicator"></div>
                <div id="upgradeWheel" class="upgrade-wheel" style="transform: rotate(0deg);">
                    <!-- Секторы колеса будут динамически обновляться JS -->
                </div>
            </div>

            <button class="btn" onclick="startUpgrade()">
                <i class="fas fa-arrow-up"></i> Upgrade!
            </button>
        </div>
    </div>
    <!-- Модальное окно пополнения -->
    <div id="topUpModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="hideTopUpModal()">
                <i class="fas fa-times"></i>
            </button>
            <h2 class="modal-title">Top-Up Balance</h2>
            <button class="btn" onclick="topUp('ton')">
                <i class="fas fa-coins"></i> TON (Bonus +10%)
            </button>
            <button class="btn" onclick="topUp('stars')">
                <i class="fas fa-star"></i> Звёзды (100 звезд = 1 TON)
            </button>
            <button class="btn" onclick="topUp('rub')">
                <i class="fas fa-ruble-sign"></i> СБП (105 руб = 1 TON)
            </button>
        </div>
    </div>
</body>
</html>
