<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.min.css">
    
    <!-- Простой относительный путь к CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Апгрейд - Towi Gifts</title>
</head>
<body>
    <!--==================== HEADER ====================-->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="index.html" class="navlogo">Towi Gifts</a>
            <div class="navmenu" id="nav-menu">
                <ul class="navlist">
                    <!-- Простые относительные пути к страницам -->
                    <li class="navitem"><a href="index.html" class="navlink">Главная</a></li>
                    <li class="navitem"><a href="cases.html" class="navlink">Кейсы</a></li>
                    <li class="navitem"><a href="inventory.html" class="navlink">Инвентарь</a></li>
                    <li class="navitem"><a href="upgrade.html" class="navlink active-link">Апгрейд</a></li>
                </ul>
                <div class="navclose" id="nav-close"><i class="ri-close-line"></i></div>
            </div>
            <div class="navtoggle" id="nav-toggle"><i class="ri-menu-line"></i></div>
        </nav>
    </header>

    <main class="main">
        <!-- ЗАГЛУШКА ДЛЯ ОБЫЧНОГО БРАУЗЕРА -->
        <div id="non-telegram-placeholder" style="display: none; text-align: center; padding: 50px; color: var(--text-color);">
            <h1>👋 Привет!</h1>
            <p>Для использования апгрейда, пожалуйста, откройте приложение через бота <a href="https://t.me/Towigifts_bot" style="color: var(--first-color);">@Towigifts_bot</a>.</p>
        </div>

        <!-- ОСНОВНОЙ КОНТЕЙНЕР ПРИЛОЖЕНИЯ -->
        <div id="app-container" style="display: none;">
            <section class="upgrade section container" id="upgrade">
                <h2 class="sectiontitle-center">Апгрейд предметов</h2>
                <div class="upgradecontainer grid">
                     <!-- Здесь будет логика апгрейда -->
                    <p style="color: var(--text-color); text-align: center;">Раздел апгрейда находится в разработке. Загляните позже!</p>
                </div>
            </section>
        </div>
    </main>

    <!--==================== FOOTER ====================-->
    <footer class="footer section">
        <div class="footercontainer container grid">
            <p class="footer__copy">&#169; Towi Gifts. Все права защищены</p>
        </div>
    </footer>

    <!--=============== TELEGRAM & JS ===============-->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Простые относительные пути к JS -->
    <script src="assets/js/global.v2.js" type="module"></script>
    <!-- Сюда позже добавим upgrade.js, пока достаточно global -->
